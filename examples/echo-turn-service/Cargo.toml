[package]
name = "vogon-echo-turn-service"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/LendEasy/vogon-rust"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
serde_json = "1"
vogon-contracts = { path = "../../crates/contracts" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
