[package]
name = "vogon-artifacts"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/LendEasy/vogon-rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "=0.30.1", features = ["auto-initialize"] }
vogon-audio-core = { path = "../audio-core" }
base64 = "0.22"
bytes = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "time"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
axum = "0.8"
