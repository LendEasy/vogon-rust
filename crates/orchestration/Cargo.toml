[package]
name = "vogon-orchestration"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/LendEasy/vogon-rust"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
vogon-contracts = { path = "../contracts" }
vogon-configuration = { path = "../configuration" }
vogon-clocks = { path = "../clocks" }
vogon-front = { path = "../front" }
vogon-playback = { path = "../playback" }
vogon-transport = { path = "../transport" }
vogon-speech-providers = { path = "../speech-providers" }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
