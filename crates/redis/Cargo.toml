[package]
name = "vogon-redis"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
redis = { version = "0.32", features = ["tokio-rustls-comp", "connection-manager", "cluster-async"] }
tokio = { version = "1", features = ["sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
vogon-resilience = { path = "../resilience" }
serde_json = "1"
