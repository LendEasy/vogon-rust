[package]
name = "vogon-service"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/LendEasy/vogon-rust"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
subtle = "2"
url = "2"
dotenvy = "0.15"
vogon-configuration = { path = "../configuration" }
vogon-contracts = { path = "../contracts" }
vogon-clocks = { path = "../clocks" }
vogon-speech-providers = { path = "../speech-providers" }
vogon-transport = { path = "../transport" }
vogon-front = { path = "../front" }
vogon-orchestration = { path = "../orchestration" }

[dev-dependencies]
tokio-tungstenite = "0.28"

[[bin]]
name = "vogon-gateway"
path = "src/main.rs"
