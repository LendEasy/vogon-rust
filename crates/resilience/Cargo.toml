[package]
name = "vogon-resilience"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/LendEasy/vogon-rust"
[dependencies]
tokio = { version = "1", features = ["time", "macros", "rt", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
