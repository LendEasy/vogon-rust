[package]
name = "vogon-escalation"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
vogon-redis = { path = "../redis" }
vogon-resilience = { path = "../resilience" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
redis = { version = "0.32", features = ["tokio-rustls-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
vogon-contracts = { path = "../contracts" }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "test-util"] }
