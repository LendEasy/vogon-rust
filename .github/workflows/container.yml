name: Deployment image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned image
        run: docker build --tag vogon-rust:ci .
      - name: Probe real interpreter and native capabilities as the runtime user
        run: docker run --rm -e FRONT_MODEL_ENABLED=false -e GATEWAY_SESSION_STORE=memory vogon-rust:ci --check --env /nonexistent
      - name: Serve readiness and drain on SIGTERM
        run: |
          docker run -d --name vogon-smoke -p 127.0.0.1:18002:8002 -e FRONT_MODEL_ENABLED=false -e GATEWAY_SESSION_STORE=memory vogon-rust:ci
          trap 'docker logs vogon-smoke; docker rm -f vogon-smoke' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18002/ready?mode=text', timeout=2)
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(1)
          PY
          docker stop --time 240 vogon-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' vogon-smoke)" = 0
